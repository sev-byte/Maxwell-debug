name: Retrieve cave GPU capture (temporary)

on:
  push:
    branches:
      - maxwell-issue-tracking
    paths:
      - '.github/workflows/retrieve-cave-capture.yml'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify capture
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/sev-byte/Maxwell-debug/releases/download/build3a-android-test-logs/Pipeline.transfer.build.3a.cave.zip" \
            -o Pipeline.transfer.build.3a.cave.zip
          echo "8120c7ab287765a469364d6bad5de14de041868f64ff2de68a5eac9b350f6fc2  Pipeline.transfer.build.3a.cave.zip" | sha256sum --check
          test -s Pipeline.transfer.build.3a.cave.zip
      - name: Make capture available for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cave-gpu-capture-transfer
          path: Pipeline.transfer.build.3a.cave.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
