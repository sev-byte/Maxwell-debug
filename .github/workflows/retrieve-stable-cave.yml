name: Retrieve stable cave GPU capture (temporary)

on:
  push:
    branches:
      - maxwell-issue-tracking
    paths:
      - '.github/workflows/retrieve-stable-cave.yml'

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the exact stable cave capture
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "https://github.com/sev-byte/Maxwell-debug/releases/download/build3a-android-test-logs/3a.stable.cave.zip" \
            -o 3a.stable.cave.zip
          echo "18f706d2a32f566eb9ddfd321c26fce18b23cb8987881ce0d77421f8e58066e3  3a.stable.cave.zip" | sha256sum --check
          test "$(stat -c '%s' 3a.stable.cave.zip)" -eq 97849594
          unzip -tq 3a.stable.cave.zip
      - name: Make exact capture available for inspection
        uses: actions/upload-artifact@v4
        with:
          name: stable-cave-gpu-capture
          path: 3a.stable.cave.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
