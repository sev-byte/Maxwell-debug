name: Build Chandelier Lighting Test APK

on:
  push:
    branches:
      - test/chandelier-light-controls
    paths:
      - ".github/workflows/build-chandelier-test.yml"
      - "src/**"
      - ".ci/android/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.5"

      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Build side-by-side Mainline RelWithDebInfo APK
        run: .ci/android/build.sh -t standard -b RelWithDebInfo

      - name: Upload APK and build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Chandelier-Light-Test-APK
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error
          retention-days: 14
